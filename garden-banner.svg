<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfcfb"/>
      <stop offset="45%" stop-color="#e8f5e0"/>
      <stop offset="100%" stop-color="#c9ecd0"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8dba0"/>
      <stop offset="100%" stop-color="#8fd18a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6fbf6a"/>
      <stop offset="100%" stop-color="#4fae55"/>
    </linearGradient>
    <radialGradient id="wingPink" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#ff8fb1"/>
    </radialGradient>
    <radialGradient id="wingBlue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#cfeaff"/>
      <stop offset="100%" stop-color="#6fb7ff"/>
    </radialGradient>
    <radialGradient id="wingYellow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="260" fill="url(#sky)"/>

  <!-- Rolling hills -->
  <path d="M0,190 Q150,150 320,185 T650,175 T1000,190 T1200,175 L1200,260 L0,260 Z" fill="url(#hillFar)" opacity="0.7"/>
  <path d="M0,215 Q200,180 420,215 T800,205 T1200,215 L1200,260 L0,260 Z" fill="url(#hillNear)"/>

  <!-- Flowers scattered on the hill -->
  <g>
    <g transform="translate(80,225)">
      <circle cx="0" cy="0" r="3.5" fill="#ff8fb1"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ffd93d"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="-6" r="3" fill="#ff8fb1"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(180,235) scale(0.8)">
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ff8fb1"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ffd93d"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(320,222) scale(1.1)">
      <circle cx="0" cy="0" r="3.5" fill="#ffd93d"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ffffff"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ff8fb1"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(500,240) scale(0.9)">
      <circle cx="0" cy="0" r="3.5" fill="#ff8fb1"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ffffff"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ffd93d"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(720,228)">
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ffd93d"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ff8fb1"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(900,238) scale(1.05)">
      <circle cx="0" cy="0" r="3.5" fill="#ff8fb1"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ffd93d"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
    <g transform="translate(1080,224)">
      <circle cx="0" cy="0" r="3.5" fill="#ffd93d"/>
      <circle cx="6" cy="-2" r="3.5" fill="#ff8fb1"/>
      <circle cx="-6" cy="-2" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="-1" r="2" fill="#f4a300"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="600" y="95" font-family="Verdana, sans-serif" font-size="40" font-weight="700" fill="#2f5233" text-anchor="middle" opacity="0">
    Dona Fidèle Houekpoeha
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="600" y="130" font-family="Verdana, sans-serif" font-size="17" fill="#4a7a4f" text-anchor="middle" opacity="0">
    Building ideas into reality with code &amp; AI
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.8s" fill="freeze"/>
  </text>

  <!-- Butterfly template as reusable group via use, three butterflies with different paths/colors/timing -->
  <g id="bfly1">
    <g id="wingsPink">
      <path d="M0,0 C-14,-14 -22,-4 -14,6 C-8,12 -2,6 0,0 Z" fill="url(#wingPink)">
        <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.35s" repeatCount="indefinite"/>
      </path>
      <path d="M0,0 C14,-14 22,-4 14,6 C8,12 2,6 0,0 Z" fill="url(#wingPink)">
        <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.35s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="0" cy="2" rx="1.6" ry="6" fill="#7a4a2f"/>
    </g>
  </g>

  <use href="#bfly1" transform="translate(0,0)">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M -40,150 C 150,60 300,180 450,90 S 750,40 900,120 S 1150,60 1260,140" />
  </use>

  <g>
    <path d="M0,0 C-14,-14 -22,-4 -14,6 C-8,12 -2,6 0,0 Z" fill="url(#wingBlue)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.28s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C14,-14 22,-4 14,6 C8,12 2,6 0,0 Z" fill="url(#wingBlue)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.28s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="0" cy="2" rx="1.6" ry="6" fill="#3a3a3a"/>
    <animateMotion dur="11s" repeatCount="indefinite" begin="-2s"
      path="M -40,190 C 200,220 350,110 520,170 S 800,220 950,140 S 1150,190 1260,150" />
  </g>

  <g transform="scale(0.75)">
    <path d="M0,0 C-14,-14 -22,-4 -14,6 C-8,12 -2,6 0,0 Z" fill="url(#wingYellow)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.22s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C14,-14 22,-4 14,6 C8,12 2,6 0,0 Z" fill="url(#wingYellow)">
      <animateTransform attributeName="transform" type="scale" values="1,1;0.35,1;1,1" additive="sum" dur="0.22s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="0" cy="2" rx="1.6" ry="6" fill="#7a4a2f"/>
    <animateMotion dur="8s" repeatCount="indefinite" begin="-4s"
      path="M -40,110 C 180,170 330,60 500,130 S 780,60 940,110 S 1140,170 1260,110" />
  </g>

</svg>
